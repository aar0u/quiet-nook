<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiet Nook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="stage">
    <div id="world">
      <canvas id="scene" width="1672" height="941"></canvas>
      <canvas id="fx" width="1672" height="941"></canvas>
    </div>
  </section>

  <aside id="panel">
    <div id="bar">
      <button id="hide" title="收起面板">✕</button>
    </div>
    <div id="scenes" aria-label="场景"></div>
    <div id="lookbar">
      <div id="looks"></div>
      <label class="check" id="autoLookRow" hidden><input id="autoLook" type="checkbox"> <span>休息时换成睡前造型</span></label>
    </div>
    <div id="timer">
      <div class="row">
        <button id="start">开始</button>
        <button id="skip" title="跳过当前阶段">跳过</button>
        <button id="reset">重置</button>
      </div>
      <div class="row small">
        <label>专注 <input id="focusMin" type="number" min="1" max="120" value="25"> 分</label>
        <label>休息 <input id="breakMin" type="number" min="1" max="60" value="5"> 分</label>
      </div>
    </div>

    <div id="sound">
      <label>雨声 <input id="rain" type="range" min="0" max="100" value="0"></label>
      <label>低频噪声 <input id="brown" type="range" min="0" max="100" value="0"></label>
      <label class="check"><input id="autoSound" type="checkbox"> 切换场景时自动配音</label>
    </div>

    <div id="chat">
      <div id="log"></div>
      <form id="chatForm"><input id="chatInput" placeholder="和她说点什么" autocomplete="off"></form>
    </div>
  </aside>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
